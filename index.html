    <style>
        :root {
            --primary-color: #0ea5e9;
            --accent-color: #25d366;
            --dark-bg: #0b0f19;
            --card-bg: #161f30;
            --border-color: #243047;
            --glow-color: rgba(14, 165, 233, 0.4);
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Navbar Styling */
        .custom-navbar {
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
        }

        .brand-icon {
            color: #0ea5e9;
            animation: pulse-glow 2s infinite alternate;
        }

        /* Keyframe Animations */
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #0ea5e9); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 10px #38bdf8); }
        }

        @keyframes floatUpDown {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Section Animation */
        .hero-section {
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
            padding: 80px 0 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-badge {
            animation: floatUpDown 3s ease-in-out infinite;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        /* Card Animation & Glassmorphism */
        .course-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeInUp 0.6s forwards;
        }

        .course-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px var(--glow-color);
        }

        .course-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 200px;
        }

        .course-img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .course-card:hover .course-img {
            transform: scale(1.1);
        }

        .category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .price-tag {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
        }

        .original-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        /* Responsive Video Container for Modal */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }


        .video-container .course-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Animated Buttons */
        .btn-whatsapp {
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: #fff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp:hover {
            background: linear-gradient(45deg, #128c7e, #25d366);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
        }

        .filter-btn {
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
        }
    
        /* Simple digital shop catalogue */
        .shop-category-section { margin-bottom: 2.1rem; }
        .shop-section-heading {
            display:flex; align-items:end; justify-content:space-between;
            gap:12px; padding:0 0 13px; margin-bottom:16px;
            border-bottom:1px solid var(--border-color);
        }
        .shop-section-kicker { color:var(--primary-color); font-size:.65rem; letter-spacing:.16em; font-weight:800; }
        .shop-section-heading h2 { font-size:clamp(1.2rem, 3vw, 1.65rem); font-weight:800; margin:4px 0 0; color:#f8fafc; }
        .shop-section-count { color:#94a3b8; font-size:.8rem; white-space:nowrap; }
        .shop-product-card {
            height:100%; overflow:hidden; border:1px solid var(--border-color);
            border-radius:14px; background:var(--card-bg); display:flex; flex-direction:column;
            transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        .shop-product-card:hover { transform:translateY(-4px); border-color:var(--primary-color); box-shadow:0 12px 28px rgba(0,0,0,.22); }
        .shop-product-image { aspect-ratio: 1.55 / 1; overflow:hidden; background:#111827; position:relative; }
        .shop-product-image .course-img { width:100%; height:100%; object-fit:cover; display:block; }
        .shop-product-image .category-badge { font-size:.62rem; padding:5px 8px; }
        .shop-product-info { padding:12px; display:flex; flex-direction:column; flex:1; }
        .shop-product-title { font-size:.9rem; line-height:1.4; font-weight:750; color:#f8fafc; min-height:2.5em; margin:0 0 7px; }
        .shop-product-description { color:#94a3b8; font-size:.76rem; line-height:1.5; margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.3em; }
        .shop-product-prices { display:flex; align-items:baseline; gap:8px; margin-top:auto; margin-bottom:12px; }
        .shop-product-prices .price-tag { font-size:1.12rem; font-weight:850; color:#34d399; }
        .shop-product-prices .original-price { font-size:.78rem; }
        .shop-product-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
        .shop-product-actions .btn { border-radius:8px; font-size:.76rem; padding:7px 4px; white-space:nowrap; }
        @media (max-width:480px) {
            .shop-product-info { padding:9px; }
            .shop-product-title { font-size:.8rem; }
            .shop-product-description { font-size:.7rem; }
            .shop-product-prices .price-tag { font-size:1rem; }
            .shop-product-actions { grid-template-columns:1fr; gap:6px; }
            .shop-section-heading { margin-bottom:12px; }
        }

                videoEmbed: `<div class="video-container mb-3"><video class="course-video" controls controlsList="nodownload noplaybackrate" disablePictureInPicture playsinline preload="metadata" oncontextmenu="return false"><source src="videos/mayajaal-course-video.mp4" type="video/mp4">আপনার ব্রাউজার ভিডিওটি চালাতে পারছে না।</video></div>`,
                shortDesc: "YouTube চ্যানেল তৈরি, SEO, ভিডিও এডিটিং ও কনটেন্ট মার্কেটিং শেখার ৫৪টি প্রি-রেকর্ডেড ক্লাস.",
                fullDesc: "<div class=\"row g-2 mb-3\"><div class=\"col-6\"><img src=\"assets/mayajall%20course%20ss1.png\" class=\"img-fluid rounded\" alt=\"কোর্সের ক্লাসের স্ক্রিনশট ১\"></div><div class=\"col-6\"><img src=\"assets/mayajall%20course%20ss2.png\" class=\"img-fluid rounded\" alt=\"কোর্সের ক্লাসের স্ক্রিনশট ২\"></div></div>\n<h5 class=\"fw-bold text-info mb-3\">🎬 মায়াজাল ইউটিউব সিক্রেট কোর্স</h5>\n<p>নিজের YouTube চ্যানেল শুরু করতে চান, অথবা ভিডিও তৈরি ও মার্কেটিংয়ের দক্ষতা বাড়াতে চান? এই প্রি-রেকর্ডেড কোর্সে YouTube চ্যানেল পরিকল্পনা থেকে শুরু করে কনটেন্ট রিসার্চ, SEO, ভিডিও এডিটিং ও চ্যানেল মনিটাইজেশন সম্পর্কে ধাপে ধাপে শেখার উপকরণ পাবেন। নিজের সুবিধামতো সময়ে ক্লাসগুলো দেখতে পারবেন।</p>\n<div class=\"alert alert-info py-2\"><strong>🔥 অফার মূল্য: ৳১৯০</strong> <span class=\"text-decoration-line-through text-muted ms-2\">৳১৫,০০০</span><br><small>প্রদর্শিত মূল মূল্য ও অফার-সংক্রান্ত তথ্য বিক্রেতার দেওয়া বিবরণ অনুযায়ী।</small></div>\n<h6 class=\"fw-bold mt-3\">📦 কোর্স প্যাকেজে যা থাকছে</h6>\n<ul class=\"lh-lg\"><li>🎥 মোট ৫৪টি প্রি-রেকর্ডেড ভিডিও ক্লাস</li><li>⏱️ ৬০ ঘণ্টার বেশি ভিডিও লেসন ও গাইডলাইন</li><li>🎞️ UHD কোয়ালিটির ভিডিও কনটেন্ট (প্রদত্ত বিবরণ অনুযায়ী)</li><li>📂 আনুমানিক ১৩.৫ GB কোর্স ফাইল</li><li>🔐 ১২টি বিশেষ/সিক্রেট ক্লাসের কনটেন্ট</li><li>🎨 ভিডিও এডিটিংয়ের জন্য প্রিমিয়াম সফটওয়্যার-সংক্রান্ত রিসোর্স</li><li>🎵 ৩,২০০+ সাউন্ড ইফেক্টের কালেকশন</li><li>🎬 ৮০০+ কপিরাইট-ফ্রি ভিডিও ফুটেজের কালেকশন (ব্যবহারের লাইসেন্স/শর্ত যাচাই করে নেবেন)</li></ul>\n<h6 class=\"fw-bold mt-3\">📚 কোর্সে যে বিষয়গুলো শিখতে পারবেন</h6>\n<ul class=\"lh-lg\"><li><strong>YouTube Channel Setup:</strong> চ্যানেলের বিষয় নির্বাচন, প্রফেশনালভাবে চ্যানেল সাজানো এবং প্রাথমিক সেটআপ</li><li><strong>Content Research & Planning:</strong> ভিডিওর আইডিয়া খোঁজা, দর্শক বোঝা, কনটেন্ট রিসার্চ ও পরিকল্পনা</li><li><strong>YouTube SEO:</strong> ভিডিওর টাইটেল, ডিসক্রিপশন, ট্যাগ, থাম্বনেইল ও সার্চে খুঁজে পাওয়ার উপযোগী অপ্টিমাইজেশন</li><li><strong>Video Marketing:</strong> ভিডিও প্রচার, দর্শকের আগ্রহ ধরে রাখা এবং কনটেন্টের পারফরম্যান্স বিশ্লেষণ</li><li><strong>Video Editing:</strong> মোবাইল ও কম্পিউটারে ভিডিও এডিটিংয়ের workflow, কাটিং, ভয়েসওভার, সাউন্ড ও ভিজ্যুয়াল ব্যবহার</li><li><strong>Copyright Awareness:</strong> কপিরাইট-ফ্রি মিউজিক ও ফুটেজ খোঁজা এবং কনটেন্ট ব্যবহারের অনুমতি/লাইসেন্স সম্পর্কে সচেতনতা</li><li><strong>Monetization:</strong> YouTube Partner Program, মনিটাইজেশনের সাধারণ শর্ত এবং আয়ের বিভিন্ন পদ্ধতি সম্পর্কে ধারণা</li><li><strong>Channel Growth:</strong> দর্শকের retention, watch time, analytics ও নিয়মিত কনটেন্ট প্রকাশের কৌশল</li></ul>\n<h6 class=\"fw-bold mt-3\">📱 কোন ডিভাইসে করতে পারবেন?</h6><p>কোর্সের ভিডিও মোবাইল, ট্যাবলেট, ল্যাপটপ বা ডেস্কটপে দেখা যাবে। ভিডিও এডিটিংয়ের জন্য আপনার ডিভাইসের ক্ষমতা অনুযায়ী উপযুক্ত সফটওয়্যার বেছে নিতে পারবেন।</p>\n<h6 class=\"fw-bold mt-3\">📥 অর্ডার ও ডেলিভারি</h6><ol class=\"lh-lg\"><li>নিচের WhatsApp অর্ডার বাটনে ক্লিক করে যোগাযোগ করুন।</li><li>পেমেন্ট ও অর্ডার নিশ্চিত করার নিয়ম জেনে নিন।</li><li>পেমেন্ট নিশ্চিত হলে কোর্সের অ্যাক্সেস/ডেলিভারি পদ্ধতি জানানো হবে।</li><li>অ্যাক্সেস পাওয়ার পর নিজের সুবিধামতো সময়ে ক্লাস দেখুন।</li></ol>\n<div class=\"alert alert-warning py-2 mb-0\"><strong>⚠️ গুরুত্বপূর্ণ নোট:</strong> এটি প্রি-রেকর্ডেড শিক্ষামূলক কনটেন্ট; লাইভ ক্লাস, ব্যক্তিগত মেন্টরশিপ বা নির্দিষ্ট সময়ের মধ্যে সফলতার নিশ্চয়তা হিসেবে বিবেচনা করবেন না। YouTube-এ ভিডিও ভাইরাল হওয়া, ভিউ/সাবস্ক্রাইবার বৃদ্ধি, মনিটাইজেশন বা আয় নিশ্চিত নয়—ফলাফল নির্ভর করে আপনার দক্ষতা, কনটেন্টের মান, ধারাবাহিকতা, দর্শকের প্রতিক্রিয়া এবং YouTube-এর নীতিমালার ওপর। সফটওয়্যার, ফুটেজ, মিউজিক ও অন্যান্য বোনাসের প্রাপ্যতা এবং ব্যবহারের লাইসেন্স অর্ডারের আগে নিশ্চিত করে নিন।</div>"
            },
        ];

        const container = document.getElementById('courseContainer');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Staggered Fade-In Animation Rendering
        function renderCourses(courseList) {
            container.innerHTML = '';
            if (!courseList.length) {
                container.innerHTML = '<div class="col-12 text-center text-secondary py-5">কোনো প্রোডাক্ট পাওয়া যায়নি!</div>';
                return;
            }

            const categoryOrder = ['youtube', 'software', 'subscription'];
            const categoryNames = {
                subscription: 'সাবস্ক্রিপশন',
                youtube: 'ইউটিউব কোর্স',
                software: 'সফটওয়্যার'
            };

            categoryOrder.forEach((category) => {
                const items = courseList.filter(course => course.category === category);
                if (!items.length) return;

                const section = document.createElement('section');
                section.className = 'shop-category-section col-12';
                section.innerHTML = `
                    <div class="shop-section-heading">
                        <div>
                            <span class="shop-section-kicker">ONE DIGITAL STORE</span>
                            <h2>${categoryNames[category]}</h2>
                        </div>
                        <span class="shop-section-count">${items.length} টি প্রোডাক্ট</span>
                    </div>
                    <div class="row g-3 g-md-4 shop-product-grid"></div>
                `;
                const grid = section.querySelector('.shop-product-grid');

                items.forEach((course, index) => {
                    const card = document.createElement('div');
                    card.className = 'col-6 col-md-4 col-lg-3';
                    card.innerHTML = `
                        <article class="course-card shop-product-card" style="animation-delay: ${(index % 8) * 0.06}s;">
                            <div class="course-img-wrapper shop-product-image">
                                <img src="${course.image}" class="course-img" alt="${course.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x220?text=One+Digital'">
                                <span class="category-badge">${categoryNames[course.category]}</span>
                            </div>
                            <div class="shop-product-info">
                                <h3 class="shop-product-title">${course.title}</h3>
                                <p class="shop-product-description">${course.shortDesc}</p>
                                <div class="shop-product-prices">
                                    <span class="price-tag">৳${course.price}</span>
                                    <span class="original-price">৳${course.originalPrice}</span>
                                </div>
                                <div class="shop-product-actions">
                                    <button class="btn btn-outline-info btn-sm" onclick="openDetails(${course.id})">বিস্তারিত</button>
                                    <a href="${getWhatsappLink(course.title, course.price)}" target="_blank" rel="noopener" class="btn btn-whatsapp btn-sm">
                                        <i class="fa-brands fa-whatsapp me-1"></i>অর্ডার
                                    </a>
                                </div>
                            </div>
                        </article>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(section);
            });
        }

        function getWhatsappLink(title, price) {
            const msg = encodeURIComponent(`হ্যালো One Digital, আমি "${title}" প্রোডাক্টটি ৳${price} দিয়ে কিনতে চাই। অর্ডারের নিয়মটি বলবেন।`);
            return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
        }

        function openDetails(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('modalTitle').innerText = course.title;
            
            // YouTube embed with ?rel=0&modestbranding=1 parameters
            let videoHtml = course.videoEmbed ? course.videoEmbed : `<div class="text-center mb-3"><img src="${course.image}" class="img-fluid rounded border border-secondary" style="max-height: 240px;" onerror="this.src='https://via.placeholder.com/600x300?text=One+Digital'"></div>`;
            
            document.getElementById('modalBody').innerHTML = `
                ${videoHtml}
                <h6 class="fw-bold text-info">প্রোডাক্টের বিবরণ:</h6>
                <div>${course.fullDesc}</div>
            `;
            document.getElementById('modalPrice').innerText = `৳${course.price}`;
            document.getElementById('modalOriginalPrice').innerText = `৳${course.originalPrice}`;
            document.getElementById('modalWhatsappBtn').href = getWhatsappLink(course.title, course.price);

            const modal = new bootstrap.Modal(document.getElementById('courseModal'));
            modal.show();
        }

        // Live Search Filter
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const text = e.target.value.toLowerCase();
                const filtered = courses.filter(c => c.title.toLowerCase().includes(text) || c.shortDesc.toLowerCase().includes(text));
                renderCourses(filtered);
            });
        }

        // Category Filter Buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('btn-info', 'active');
                    b.classList.add('btn-outline-info');
                });
                btn.classList.remove('btn-outline-info');
                btn.classList.add('btn-info', 'active');

                const cat = btn.getAttribute('data-category');
                if (cat === 'all') {
                    renderCourses(courses);
                } else {
                    const filtered = courses.filter(c => c.category === cat);
                    renderCourses(filtered);
                }
            });
        });


        // Best-effort download deterrents (not DRM; the media URL remains accessible).
        document.addEventListener('contextmenu', (event) => {
            if (event.target.closest('.course-video')) event.preventDefault();
        });

        // Initial Execution
        renderCourses(courses);
    </script>
    <script src="assets/advanced-effects.js" defer></script>
</body>
</html>
