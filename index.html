<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Digital - Digital Courses & Subscriptions</title>
    <!-- Bootstrap CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-info fs-3" href="#">
                <i class="fa-solid fa-bolt me-2"></i>One Digital
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="#courses" class="btn btn-outline-info btn-sm rounded-pill px-3">প্রোডাক্টসমূহ</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section text-center">
        <div class="container">
            <span class="badge bg-info text-dark px-3 py-2 rounded-pill mb-3 fw-bold">ইনস্ট্যান্ট ডেলিভারি ও ২০০% বিশ্বস্ত সার্ভিস!</span>
            <h1 class="display-5 fw-bold mb-3 text-white">One Digital প্রিমিয়াম সার্ভিস ও কোর্সসমূহ</h1>
            <p class="text-secondary fs-5 mx-auto" style="max-width: 650px;">
                ইউটিউব কোর্স, সফটওয়্যার প্যাকেজ এবং AI/OTT সাবস্ক্রিপশন কিনুন আকর্ষণীয় মূল্যে।
            </p>
        </div>
    </section>

    <!-- Search & Filter Section -->
    <section class="container my-4">
        <div class="row g-3 justify-content-between align-items-center">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" class="form-control bg-dark border-secondary text-white" placeholder="সার্ভিস বা কোর্সের নাম দিয়ে খুঁজুন...">
                </div>
            </div>
            <div class="col-md-8 d-flex flex-wrap gap-2 justify-md-content-end" id="categoryFilters">
                <button class="btn btn-sm btn-info filter-btn active" data-category="all">সব সার্ভিস</button>
                <button class="btn btn-sm btn-outline-info filter-btn" data-category="subscription">সাবস্ক্রিপশন (AI & OTT)</button>
                <button class="btn btn-sm btn-outline-info filter-btn" data-category="youtube">ইউটিউব কোর্স</button>
                <button class="btn btn-sm btn-outline-info filter-btn" data-category="software">সফটওয়্যার</button>
                <button class="btn btn-sm btn-outline-info filter-btn" data-category="web">ওয়েব ডেভেলপমেন্ট</button>
                <button class="btn btn-sm btn-outline-info filter-btn" data-category="graphics">গ্রাফিক্স</button>
            </div>
        </div>
    </section>

    <!-- Products & Courses Section -->
    <section id="courses" class="py-4">
        <div class="container">
            <div class="row g-4" id="courseContainer">
                <!-- app.js থেকে এখানে প্রোডাক্ট কার্ডগুলো আসবে -->
            </div>
        </div>
    </section>

    <!-- Modal for Product Details -->
    <div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="modalTitle">প্রোডাক্টের নাম</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Dynamic Details -->
                </div>
                <div class="modal-footer border-secondary justify-content-between">
                    <div>
                        <span class="fs-4 fw-bold text-success" id="modalPrice"></span>
                        <span class="text-decoration-line-through text-muted ms-2" id="modalOriginalPrice"></span>
                    </div>
                    <a id="modalWhatsappBtn" href="#" target="_blank" class="btn btn-whatsapp px-4 rounded-pill">
                        <i class="fa-brands fa-whatsapp me-2"></i>WhatsApp-এ অর্ডার করুন
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 border-top border-secondary text-secondary mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 One Digital. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap & JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
