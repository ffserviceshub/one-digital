    <style>
        :root {
            --primary-color: #0ea5e9;
            --accent-color: #25d366;
            --dark-bg: #0b0f19;
            --card-bg: #161f30;
            --border-color: #243047;
            --glow-color: rgba(14, 165, 233, 0.4);
        }

        body {
            background-color: var(--dark-bg);
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Navbar Styling */
        .custom-navbar {
            background-color: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
        }

        .brand-icon {
            color: #0ea5e9;
            animation: pulse-glow 2s infinite alternate;
        }

        /* Keyframe Animations */
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px #0ea5e9); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 10px #38bdf8); }
        }

        @keyframes floatUpDown {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hero Section Animation */
        .hero-section {
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
            padding: 80px 0 50px;
            animation: fadeInUp 0.8s ease-out;
        }

        .hero-badge {
            animation: floatUpDown 3s ease-in-out infinite;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        /* Card Animation & Glassmorphism */
        .course-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeInUp 0.6s forwards;
        }

        .course-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary-color);
            box-shadow: 0 15px 30px var(--glow-color);
        }

        .course-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 200px;
        }

        .course-img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .course-card:hover .course-img {
            transform: scale(1.1);
        }

        .category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .price-tag {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
        }

        .original-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.9rem;
            margin-left: 6px;
        }

        /* Animated Buttons */
        .btn-whatsapp {
            background: linear-gradient(45deg, #25d366, #128c7e);
            color: #fff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp:hover {
            background: linear-gradient(45deg, #128c7e, #25d366);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.45);
        }

        .filter-btn {
            transition: all 0.3s ease;
            border-radius: 20px;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 16px;

                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getWhatsappLink(title, price) {
            const msg = encodeURIComponent(`হ্যালো One Digital, আমি "${title}" প্রোডাক্টটি ৳${price} দিয়ে কিনতে চাই। অর্ডারের নিয়মটি বলবেন।`);
            return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
        }

        function openDetails(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            document.getElementById('modalTitle').innerText = course.title;
            document.getElementById('modalBody').innerHTML = `
                <div class="text-center mb-3">
                    <img src="${course.image}" class="img-fluid rounded border border-secondary" style="max-height: 240px;" onerror="this.src='https://via.placeholder.com/600x300?text=One+Digital'">
                </div>
                <h6 class="fw-bold text-info">প্রোডাক্টের বিবরণ:</h6>
                <div>${course.fullDesc}</div>
            `;
            document.getElementById('modalPrice').innerText = `৳${course.price}`;
            document.getElementById('modalOriginalPrice').innerText = `৳${course.originalPrice}`;
            document.getElementById('modalWhatsappBtn').href = getWhatsappLink(course.title, course.price);

            const modal = new bootstrap.Modal(document.getElementById('courseModal'));
            modal.show();
        }

        // Live Search Filter
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const text = e.target.value.toLowerCase();
                const filtered = courses.filter(c => c.title.toLowerCase().includes(text) || c.shortDesc.toLowerCase().includes(text));
                renderCourses(filtered);
            });
        }

        // Category Filter Buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('btn-info', 'active');
                    b.classList.add('btn-outline-info');
                });
                btn.classList.remove('btn-outline-info');
                btn.classList.add('btn-info', 'active');

                const cat = btn.getAttribute('data-category');
                if (cat === 'all') {
                    renderCourses(courses);
                } else {
                    const filtered = courses.filter(c => c.category === cat);
                    renderCourses(filtered);
                }
            });
        });

        // Initial Execution
        renderCourses(courses);
    </script>
</body>
</html>
